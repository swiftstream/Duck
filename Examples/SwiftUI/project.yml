name: DuckSwiftUIDemo
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "12.0"
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.swiftstream.duck.swiftuidemo
packages:
  Duck:
    path: ../..
targets:
  DuckSwiftUIDemoMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
    dependencies:
      - package: Duck
        product: Duck
  DuckSwiftUIDemoiOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - package: Duck
        product: Duck
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  DuckSwiftUIDemoMac:
    build:
      targets:
        DuckSwiftUIDemoMac: all
    run:
      config: Debug
  DuckSwiftUIDemoiOS:
    build:
      targets:
        DuckSwiftUIDemoiOS: all
    run:
      config: Debug

name: DuckUIKitPlusDemo
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: '12.0'
    iOS: '15.0'
packages:
  Duck:
    path: ../..
  UIKitPlus:
    url: https://github.com/SwiftStream/UIKitUltra.git
    revision: 69c3aaaa7b8e040bc206d0e9243dc90c1f23cb11
targets:
  DuckUIKitPlusDemoMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
    dependencies:
      - package: Duck
      - package: UIKitPlus
        product: UIKitPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftstream.DuckUIKitPlusDemo.macOS
        SWIFT_VERSION: '6.0'
        MACOSX_DEPLOYMENT_TARGET: '12.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: "$(PRODUCT_MODULE_NAME).App"
  DuckUIKitPlusDemoiOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - package: Duck
      - package: UIKitPlus
        product: UIKitPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftstream.DuckUIKitPlusDemo.iOS
        SWIFT_VERSION: '6.0'
        IPHONEOS_DEPLOYMENT_TARGET: '15.0'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  DuckUIKitPlusDemoMac:
    build:
      targets:
        DuckUIKitPlusDemoMac: all
    run:
      config: Debug
  DuckUIKitPlusDemoiOS:
    build:
      targets:
        DuckUIKitPlusDemoiOS: all
    run:
      config: Debug

name: test

on:
  push:
    branches:
      - master
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable release tag (X.Y.Z)"
        required: true
        type: string
      release_sha:
        description: "Expected full commit SHA of the release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  swift_6_3_3:
    name: Swift 6.3.3
    runs-on: ubuntu-latest
    container: swift:6.3.3
    timeout-minutes: 60

    steps:
      - name: Validate manual release inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: expected unprefixed X.Y.Z" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: expected 40 lowercase hexadecimal characters" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - name: Verify manual release checkout
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          actual="$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          if [[ "$actual" != "$RELEASE_SHA" ]]; then
            echo "Release checkout does not match the expected commit" >&2
            exit 1
          fi
          printf 'RELEASE_TAG=%s\nRELEASE_SHA=%s\n' "$RELEASE_TAG" "$actual"

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test -j 1 -c debug
